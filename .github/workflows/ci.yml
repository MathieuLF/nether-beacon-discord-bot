name: Validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm run setup
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [alpha, muse]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Exercise restrictive source permissions for Muse
        if: matrix.target == 'muse'
        run: chmod 0600 config/muse-package.json config/muse-yarn.lock
      - name: Build, probe and scan disposable candidate images
        run: node scripts/check-containers.js ${{ matrix.target }} --scan
